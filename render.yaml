services:
  - type: web
    name: social-app-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:server
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /data/social.db
      - key: UPLOADS_DIR
        value: /data/uploads
      - key: CORS_ORIGIN
        value: https://workspace-six-rose.vercel.app
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
