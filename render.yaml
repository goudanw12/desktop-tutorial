services:
  - type: web
    name: social-app-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build:server
    startCommand: node api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /data/social.db
      - key: UPLOADS_DIR
        value: /data/uploads
      - key: CORS_ORIGIN
        value: https://desktop-tutorial.244628270.workers.dev
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
